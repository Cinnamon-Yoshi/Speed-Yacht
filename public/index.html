<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roatan Yahtzee</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='0' y='0' width='100' height='100' rx='20' fill='%230b3d2e'/><g transform='rotate(45 50 50)'><rect x='20' y='20' width='60' height='60' rx='12' fill='%23ffffff'/><circle cx='35' cy='35' r='7' fill='%230b3d2e'/><circle cx='65' cy='35' r='7' fill='%230b3d2e'/><circle cx='50' cy='50' r='7' fill='%230b3d2e'/><circle cx='35' cy='65' r='7' fill='%230b3d2e'/><circle cx='65' cy='65' r='7' fill='%230b3d2e'/></g></svg>">
<style>
  :root{ --bg:#0b3d2e; --gold:#d4af37; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:#111; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff; display:flex; justify-content:center; padding:16px 10px 60px; min-height:100vh;
  }
  .wrap{max-width:430px;width:100%;}
  .phone{ background:var(--bg); border-radius:20px; padding:16px; }
  .h-title{ font-weight:800; font-size:1.3em; text-align:center; margin-bottom:2px; }
  .app-version{ font-size:0.72em; font-weight:400; opacity:0.5; text-align:center; margin-bottom:10px; }

  /* ===== Playing screen ===== */
  .play-header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .round-box{
    background:rgba(0,0,0,0.25); border:1px solid rgba(212,175,55,0.4); border-radius:10px;
    padding:8px 12px; text-align:center; flex:0 0 auto;
  }
  .round-lbl{ font-size:0.62em; font-weight:700; opacity:0.6; text-transform:uppercase; }
  .round-num{ font-weight:900; color:var(--gold); font-size:1em; }
  .timer-track{ flex:1; height:8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden; }
  .timer-fill{ height:100%; background:var(--gold); width:100%; transition:width 1s linear; }

  .dice-row{ display:flex; gap:8px; margin-bottom:10px; justify-content:center; }
  .die{
    width:56px; height:56px; background:#fff; border-radius:10px; position:relative;
    cursor:pointer; flex:0 0 auto;
  }
  .die.held{ background:var(--gold); }
  .die.held .pip{ background:#1a1200; }
  .die.locked{ opacity:0.5; cursor:default; }
  .pipgrid{ position:absolute; inset:14%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); }
  .pip{ width:65%; height:65%; margin:auto; border-radius:50%; background:#111; justify-self:center; align-self:center; }
  .hold-lbl{ position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:3px; font-size:0.6em; font-weight:700; opacity:0.6; white-space:nowrap; }

  .play-status{ text-align:center; font-size:0.78em; opacity:0.65; margin:8px 0 14px; min-height:1.2em; }

  .scoresheet{ display:flex; flex-direction:column; gap:4px; }
  .sc-header{ display:flex; gap:4px; font-size:0.68em; font-weight:800; opacity:0.6; padding:0 2px 4px; }
  .sc-header .sc-name-col{ flex:1.4; }
  .sc-header .sc-player-col{ flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sc-row{ display:flex; gap:4px; align-items:stretch; }
  .sc-cat-cell{
    flex:1.4; background:rgba(255,255,255,0.05); border-radius:6px; padding:6px 8px;
    font-size:0.75em; font-weight:700; display:flex; align-items:center;
  }
  .sc-player-cell{
    flex:1; background:rgba(255,255,255,0.05); border-radius:6px; padding:6px 4px;
    font-size:0.8em; font-weight:800; text-align:center; display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .sc-player-cell.mine.pickable{
    background:rgba(212,175,55,0.15); border:1px solid rgba(212,175,55,0.5); cursor:pointer; color:var(--gold);
  }
  .sc-player-cell.mine.pickable.zero{ opacity:0.45; }
  .sc-player-cell.scored{ color:var(--gold); }
  .sc-total-row{ margin-top:6px; border-top:1px solid rgba(212,175,55,0.3); padding-top:6px; }
  .sc-total-row .sc-cat-cell, .sc-total-row .sc-player-cell{ font-weight:900; background:none; }

  /* ===== Results screen ===== */
  .fr-row{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:8px;
  }
  .fr-row.winner{ background:rgba(212,175,55,0.15); border:1px solid rgba(212,175,55,0.5); }
  .fr-rank{ font-weight:900; width:22px; opacity:0.7; }
  .fr-row.winner .fr-rank{ opacity:1; color:var(--gold); }
  .fr-name{ flex:1; font-weight:800; }
  .fr-score{ font-weight:900; font-size:1.2em; color:var(--gold); }
  .h-sub{ opacity:0.6; font-size:0.85em; text-align:center; margin-bottom:18px; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .lobby-input{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(212,175,55,0.4); border-radius:10px;
    color:#fff; font-weight:800; font-size:1em; padding:12px 14px; margin-bottom:14px; text-align:center;
  }
  .primary-btn{
    width:100%; padding:14px; border:none; border-radius:12px; background:var(--gold); color:#111;
    font-weight:900; font-size:1em; cursor:pointer;
  }
  .primary-btn:disabled{ opacity:0.5; cursor:default; }
  .secondary-btn{
    width:100%; padding:12px; border:1px solid rgba(255,255,255,0.3); border-radius:12px; background:none; color:#fff;
    font-weight:700; font-size:0.9em; cursor:pointer; margin-top:10px;
  }
  .error-msg{ font-size:0.8em; color:#ff8c8c; text-align:center; margin-bottom:10px; min-height:1.2em; }

  .player-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    background:rgba(255,255,255,0.05); border-radius:8px; margin-bottom:8px; font-size:0.9em; font-weight:700;
  }
  .player-row .tag{ font-size:0.7em; font-weight:800; opacity:0.6; color:var(--gold); }
  .reconnecting{ font-size:0.72em; font-weight:400; opacity:0.5; font-style:italic; }
  .waiting-msg{ text-align:center; font-size:0.85em; opacity:0.6; padding:16px; font-style:italic; }

  .admin-btn{
    width:100%; padding:10px; border:1px solid rgba(212,175,55,0.5); border-radius:10px; background:none;
    color:var(--gold); font-weight:800; font-size:0.85em; cursor:pointer; margin-top:14px;
  }
  .pin-box{
    margin-top:10px; background:rgba(0,0,0,0.25); border:1px solid rgba(212,175,55,0.3);
    border-radius:12px; padding:14px; text-align:center;
  }
  .pin-label{ font-size:0.75em; font-weight:800; opacity:0.7; margin-bottom:8px; }
  .pin-input{
    width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(212,175,55,0.5); border-radius:8px;
    color:#fff; font-size:1.1em; font-weight:800; text-align:center; padding:10px; letter-spacing:3px;
  }
  .pin-error{ font-size:0.75em; color:#ff8c8c; min-height:1.2em; margin-top:6px; }
  .pin-btn-row{ display:flex; gap:8px; margin-top:8px; }
  .pin-btn-row .primary-btn, .pin-btn-row .secondary-btn{ margin-top:0; padding:10px; font-size:0.85em; }

  .gi-settings-box{
    width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(212,175,55,0.3);
    border-radius:12px; padding:14px; margin-bottom:16px; text-align:left;
  }
  .gi-setting-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:0.85em; font-weight:700; }
  .gi-setting-row:last-child{ margin-bottom:0; }
  .gi-setting-select{
    background:rgba(255,255,255,0.08); border:1px solid rgba(212,175,55,0.5);
    border-radius:6px; color:#fff; font-weight:800; font-size:0.95em;
    padding:4px 8px; width:108px; text-align-last:center; cursor:pointer;
  }
  .gi-setting-value{ font-weight:800; color:var(--gold); }
  .toggle{
    width:40px; height:23px; border-radius:12px; background:rgba(255,255,255,0.15); position:relative; cursor:pointer;
    transition:background .15s; flex:0 0 auto; border:1px solid rgba(212,175,55,0.5);
  }
  .toggle.on{ background:var(--gold); border-color:var(--gold); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on .knob{ left:19px; background:#111; }

  .status-msg{ text-align:center; font-size:0.82em; opacity:0.65; margin-top:12px; }
  .conn-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; background:#ff6b6b; }
  .conn-dot.connected{ background:#5fd38d; }
  .conn-status{ text-align:center; font-size:0.7em; opacity:0.5; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap"><div class="phone">

  <div class="h-title">♠ Roatan Yahtzee</div>
  <div class="app-version" id="appVersion"></div>
  <div class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">Connecting…</span></div>

  <!-- Lobby -->
  <div class="screen active" id="screenLobby">
    <div class="h-sub">Enter your name to join the game</div>
    <div class="error-msg" id="lobbyError"></div>
    <input class="lobby-input" id="nameInput" placeholder="Your name" maxlength="20">
    <button class="primary-btn" id="joinBtn">Join</button>
  </div>

  <!-- Waiting Room -->
  <div class="screen" id="screenWaiting">
    <div class="h-sub">Waiting Room</div>
    <div id="playerList"></div>
    <div class="waiting-msg" id="waitingMsg">Waiting for host to start the game…</div>
    <div class="gi-settings-box" id="liveSettingsBox" style="display:none;"></div>

    <button class="admin-btn" id="adminBtn">🔒 Admin</button>
    <div class="pin-box" id="pinBox" style="display:none;">
      <div class="pin-label">Host PIN</div>
      <input type="password" inputmode="numeric" class="pin-input" id="pinInput" placeholder="••••" maxlength="8">
      <div class="pin-error" id="pinError"></div>
      <div class="pin-btn-row">
        <button class="secondary-btn" id="pinCancelBtn">Cancel</button>
        <button class="primary-btn" id="pinSubmitBtn">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Edit (host only) -->
  <div class="screen" id="screenEdit">
    <div class="h-sub">Game Settings (editing)</div>
    <div class="gi-settings-box">
      <div class="gi-setting-row"><span>Rolls per turn:</span>
        <select class="gi-setting-select" id="editRolls">
          <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option>
        </select>
      </div>
      <div class="gi-setting-row"><span>Round Advance:</span>
        <select class="gi-setting-select" id="editAdvance">
          <option value="When-Ready">When-Ready</option><option value="Full-30" selected>Full-30</option>
        </select>
      </div>
      <div class="gi-setting-row"><span>Fill empty seats with bots:</span>
        <div class="toggle on" id="editBotsToggle"><div class="knob"></div></div>
      </div>
    </div>
    <button class="primary-btn" id="confirmSettingsBtn">Confirm — Send to Players</button>
  </div>

  <!-- Accept -->
  <div class="screen" id="screenAccept">
    <div class="h-sub">Confirm Game Settings</div>
    <div class="gi-settings-box" id="acceptSettingsBox"></div>
    <div id="acceptList"></div>
    <button class="primary-btn" id="acceptBtn">Accept</button>
    <button class="secondary-btn" id="editAgainBtn" style="display:none;">Edit Settings Again</button>
  </div>

  <!-- Playing -->
  <div class="screen" id="screenPlaying">
    <div class="play-header">
      <div class="round-box"><div class="round-lbl">Round</div><div class="round-num" id="roundNum">1 of 13</div></div>
      <div class="timer-track" id="timerTrack" style="display:none;"><div class="timer-fill" id="timerFill"></div></div>
      <div class="app-version" id="appVersionPlaying" style="margin:0;flex:0 0 auto;"></div>
    </div>

    <div class="dice-row" id="diceRow"></div>
    <button class="primary-btn" id="rollBtn">Roll</button>
    <div class="play-status" id="playStatus"></div>

    <div class="scoresheet" id="scoresheet"></div>
  </div>

  <!-- Results -->
  <div class="screen" id="screenResults">
    <div class="h-sub">🏆 Game Complete</div>
    <div id="resultsList"></div>
  </div>

</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// Single source of truth for the displayed version — bump this (and
// package.json's "version") on every meaningful change. Shown on the
// Lobby/home screen here; ALSO needs to render on the scorecard screen
// once Phase 3 (real gameplay) exists — that screen doesn't exist yet,
// so it isn't there yet either. Don't forget it when building Phase 3.
const APP_VERSION = '1.3';
document.getElementById('appVersion').textContent = 'v' + APP_VERSION;
document.getElementById('appVersionPlaying').textContent = 'v' + APP_VERSION;

const socket = io();
let myId = null;
let amHost = false;
let latestState = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

socket.on('connect', () => {
  document.getElementById('connDot').classList.add('connected');
  document.getElementById('connText').textContent = 'Connected';
});
socket.on('disconnect', () => {
  document.getElementById('connDot').classList.remove('connected');
  document.getElementById('connText').textContent = 'Disconnected — reconnecting…';
});

document.getElementById('joinBtn').onclick = () => {
  const name = document.getElementById('nameInput').value;
  socket.emit('join_lobby', name);
};
socket.on('join_error', (msg) => {
  document.getElementById('lobbyError').textContent = msg;
});
socket.on('joined', ({ id, isHost }) => {
  myId = id;
  amHost = isHost;
  document.getElementById('lobbyError').textContent = '';
});

document.getElementById('adminBtn').onclick = () => {
  document.getElementById('pinBox').style.display = '';
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinInput').focus();
};
document.getElementById('pinCancelBtn').onclick = () => {
  document.getElementById('pinBox').style.display = 'none';
};
document.getElementById('pinSubmitBtn').onclick = () => {
  socket.emit('claim_host', document.getElementById('pinInput').value);
};
socket.on('host_claim_result', ({ success, message }) => {
  if (success) {
    document.getElementById('pinBox').style.display = 'none';
    // The follow-up state_update (already broadcast server-side) moves
    // us to the Edit screen automatically since amHost will now be true.
  } else {
    document.getElementById('pinError').textContent = message || 'Incorrect PIN.';
  }
});
document.getElementById('confirmSettingsBtn').onclick = () => {
  socket.emit('host_confirm_settings');
};
document.getElementById('acceptBtn').onclick = () => {
  socket.emit('player_accept');
  document.getElementById('acceptBtn').disabled = true;
  document.getElementById('acceptBtn').textContent = 'Waiting on others…';
};
document.getElementById('editAgainBtn').onclick = () => socket.emit('host_edit_again');
document.getElementById('editBotsToggle').onclick = function(){
  this.classList.toggle('on');
  emitLiveSettings();
};
['editRolls','editAdvance'].forEach(id => {
  document.getElementById(id).onchange = emitLiveSettings;
});
function emitLiveSettings(){
  socket.emit('host_update_settings', {
    rollsPerTurn: parseInt(document.getElementById('editRolls').value, 10),
    roundAdvance: document.getElementById('editAdvance').value,
    fillWithBots: document.getElementById('editBotsToggle').classList.contains('on')
  });
}

function renderSettingsReadout(settings){
  return `
    <div class="gi-setting-row"><span>Rolls per turn:</span><span class="gi-setting-value">${settings.rollsPerTurn}</span></div>
    <div class="gi-setting-row"><span>Round Advance:</span><span class="gi-setting-value">${settings.roundAdvance}</span></div>
    <div class="gi-setting-row"><span>Fill seats with bots:</span><span class="gi-setting-value">${settings.fillWithBots ? 'On' : 'Off'}</span></div>
  `;
}

socket.on('state_update', (state) => {
  latestState = state;
  amHost = state.hostId === myId;

  if (myId && state.players.some(p => p.id === myId)) {
    // We've joined — render whichever screen matches the server's phase.
    if (state.phase === 'lobby') {
      showScreen('screenWaiting');
      document.getElementById('playerList').innerHTML = state.players.map(p =>
        `<div class="player-row"><span>${p.name}${p.connected ? '' : ' <span class="reconnecting">reconnecting…</span>'}</span>${p.id === state.hostId ? '<span class="tag">HOST</span>' : ''}</div>`
      ).join('');
      document.getElementById('waitingMsg').style.display = '';
      document.getElementById('liveSettingsBox').style.display = 'none';
      document.getElementById('adminBtn').style.display = '';
    } else if (state.phase === 'editing') {
      if (amHost) {
        showScreen('screenEdit');
      } else {
        showScreen('screenWaiting');
        document.getElementById('playerList').innerHTML = state.players.map(p =>
          `<div class="player-row"><span>${p.name}${p.connected ? '' : ' <span class="reconnecting">reconnecting…</span>'}</span>${p.id === state.hostId ? '<span class="tag">HOST</span>' : ''}</div>`
        ).join('');
        document.getElementById('waitingMsg').style.display = 'none';
        document.getElementById('liveSettingsBox').style.display = '';
        document.getElementById('liveSettingsBox').innerHTML =
          '<div style="font-size:0.68em;font-weight:800;opacity:0.5;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:6px;">Host is setting up — live preview</div>'
          + renderSettingsReadout(state.settings);
        // Admin/PIN stays available even once someone else is editing —
        // if the host's connection dies mid-setup, anyone who knows the
        // PIN can still take over rather than the game being stuck.
        document.getElementById('adminBtn').style.display = '';
      }
    } else if (state.phase === 'accepting') {
      showScreen('screenAccept');
      document.getElementById('acceptSettingsBox').innerHTML = renderSettingsReadout(state.settings);
      document.getElementById('acceptList').innerHTML = state.players.map(p =>
        `<div class="player-row"><span>${p.name}${p.connected ? '' : ' <span class="reconnecting">reconnecting…</span>'}</span><span class="tag">${state.accepted[p.id] ? 'Accepted' : 'Waiting'}</span></div>`
      ).join('');
      const alreadyAccepted = !!state.accepted[myId];
      document.getElementById('acceptBtn').disabled = alreadyAccepted;
      document.getElementById('acceptBtn').textContent = alreadyAccepted ? 'Waiting on others…' : 'Accept';
      document.getElementById('editAgainBtn').style.display = amHost ? '' : 'none';
    } else if (state.phase === 'playing') {
      if (state.game.gameOver) {
        showScreen('screenResults');
        renderResults(state);
      } else {
        showScreen('screenPlaying');
        renderPlaying(state);
      }
    }
  } else {
    showScreen('screenLobby');
  }
});

// ── Gameplay rendering ─────────────────────────────────────────────
const CATEGORY_LABELS = {
  ones: 'Ones', twos: 'Twos', threes: 'Threes', fours: 'Fours', fives: 'Fives', sixes: 'Sixes',
  threeKind: '3 of a Kind', fourKind: '4 of a Kind', fullHouse: 'Full House',
  smStraight: 'Sm. Straight', lgStraight: 'Lg. Straight', chance: 'Chance', yahtzee: 'Yahtzee'
};
const CATEGORY_ORDER = Object.keys(CATEGORY_LABELS);

// Duplicated (deliberately) from server.js's scoring.js — used ONLY to
// show a live preview of what a category WOULD score before you tap it.
// The server independently computes and owns the value that actually
// gets committed when you pick_category; this client copy never writes
// anything, so there's no way a mismatched preview could let someone
// score more than the server allows.
function previewScoreFor(key, dice, settings) {
  const counts = {};
  dice.forEach(v => counts[v] = (counts[v] || 0) + 1);
  const countValues = Object.values(counts);
  const sum = dice.reduce((a, b) => a + b, 0);
  const uniqueSorted = [...new Set(dice)].sort((a, b) => a - b);
  function hasStraight(len) {
    let run = 1;
    for (let i = 1; i < uniqueSorted.length; i++) {
      run = (uniqueSorted[i] === uniqueSorted[i-1]+1) ? run+1 : 1;
      if (run >= len) return true;
    }
    return len <= 1;
  }
  switch (key) {
    case 'ones': return (counts[1]||0)*1;
    case 'twos': return (counts[2]||0)*2;
    case 'threes': return (counts[3]||0)*3;
    case 'fours': return (counts[4]||0)*4;
    case 'fives': return (counts[5]||0)*5;
    case 'sixes': return (counts[6]||0)*6;
    case 'threeKind': return countValues.some(c=>c>=3) ? sum : 0;
    case 'fourKind': return countValues.some(c=>c>=4) ? sum : 0;
    case 'fullHouse': {
      const sorted = countValues.slice().sort();
      const proper = sorted.length===2 && sorted[0]===2 && sorted[1]===3;
      const fiveOfAKind = countValues.some(c=>c===5);
      return (proper || fiveOfAKind) ? 25 : 0;
    }
    case 'smStraight': return hasStraight(4) ? 30 : 0;
    case 'lgStraight': return hasStraight(5) ? 40 : 0;
    case 'chance': return sum;
    case 'yahtzee': return (new Set(dice).size===1) ? (settings.firstYahtzee||50) : 0;
    default: return 0;
  }
}

let lastRoundRendered = null;
function renderPlaying(state) {
  const g = state.game;
  document.getElementById('roundNum').textContent = `${g.round} of ${g.totalRounds}`;

  const myG = g.players[myId];
  if (!myG) return;

  // Timer (Full-30 mode only)
  const timerTrack = document.getElementById('timerTrack');
  if (g.roundEndsAt) {
    timerTrack.style.display = '';
    const msLeft = Math.max(0, g.roundEndsAt - Date.now());
    document.getElementById('timerFill').style.width = Math.round((msLeft/30000)*100) + '%';
  } else {
    timerTrack.style.display = 'none';
  }

  // Dice
  const canInteract = !myG.doneThisRound;
  const diceRow = document.getElementById('diceRow');
  diceRow.innerHTML = myG.dice.map((val, i) => {
    const held = myG.held[i];
    const clickable = canInteract && myG.rollsUsed > 0;
    return `<div class="die${held?' held':''}${clickable?'':' locked'}" data-i="${i}">
      ${pipGridHtml(val)}
      ${held ? '<span class="hold-lbl">HOLD</span>' : ''}
    </div>`;
  }).join('');
  diceRow.querySelectorAll('.die').forEach(el => {
    el.onclick = () => {
      if (!canInteract || myG.rollsUsed === 0) return;
      socket.emit('toggle_hold', parseInt(el.dataset.i, 10));
    };
  });

  const rollsLeft = state.settings.rollsPerTurn - myG.rollsUsed;
  const rollBtn = document.getElementById('rollBtn');
  rollBtn.disabled = !canInteract || rollsLeft <= 0;
  rollBtn.textContent = canInteract ? `Roll (${Math.max(0,rollsLeft)} left)` : 'Done this round';
  rollBtn.onclick = () => { if (canInteract && rollsLeft > 0) socket.emit('roll_dice'); };

  document.getElementById('playStatus').textContent =
    myG.doneThisRound ? "You're done this round — waiting on other players…" :
    (myG.rollsUsed === 0 ? 'Tap Roll to get started.' : 'Tap a die to hold it, or pick a category below.');

  renderScoresheet(state);
}

function renderScoresheet(state) {
  const g = state.game;
  const players = state.players;
  const myG = g.players[myId];

  let header = '<div class="sc-header"><div class="sc-name-col"></div>' +
    players.map(p => `<div class="sc-player-col">${p.name}</div>`).join('') + '</div>';

  let rows = CATEGORY_ORDER.map(key => {
    const cells = players.map(p => {
      const pg = g.players[p.id];
      if (!pg) return '<div class="sc-player-cell">—</div>';
      const hasScore = Object.prototype.hasOwnProperty.call(pg.scores, key);
      if (hasScore) {
        return `<div class="sc-player-cell scored">${pg.scores[key]}</div>`;
      }
      if (p.id === myId && myG && !myG.doneThisRound && myG.rollsUsed > 0) {
        const preview = previewScoreFor(key, myG.dice, state.settings);
        return `<div class="sc-player-cell mine pickable${preview===0?' zero':''}" data-key="${key}">${preview}</div>`;
      }
      return '<div class="sc-player-cell">—</div>';
    }).join('');
    return `<div class="sc-row"><div class="sc-cat-cell">${CATEGORY_LABELS[key]}</div>${cells}</div>`;
  }).join('');

  const totalCells = players.map(p => {
    const pg = g.players[p.id];
    return `<div class="sc-player-cell">${pg ? pg.total : 0}</div>`;
  }).join('');
  const totalRow = `<div class="sc-row sc-total-row"><div class="sc-cat-cell">Total</div>${totalCells}</div>`;

  document.getElementById('scoresheet').innerHTML = header + rows + totalRow;
  document.querySelectorAll('.sc-player-cell.pickable').forEach(el => {
    el.onclick = () => socket.emit('pick_category', el.dataset.key);
  });
}

function renderResults(state) {
  const ranked = state.players
    .map(p => ({ name: p.name, total: state.game.players[p.id] ? state.game.players[p.id].total : 0 }))
    .sort((a, b) => b.total - a.total);
  document.getElementById('resultsList').innerHTML = ranked.map((r, i) => `
    <div class="fr-row${i===0?' winner':''}">
      <span class="fr-rank">${i+1}</span>
      <span class="fr-name">${r.name}</span>
      <span class="fr-score">${r.total}</span>
    </div>
  `).join('');
}

const PIP_POS = {
  1: [[2,2]], 2: [[1,1],[3,3]], 3: [[1,1],[2,2],[3,3]],
  4: [[1,1],[1,3],[3,1],[3,3]], 5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
  6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
};
function pipGridHtml(value) {
  const pos = PIP_POS[value] || [];
  const pips = pos.map(([r,c]) => `<span class="pip" style="grid-row:${r};grid-column:${c};"></span>`).join('');
  return `<span class="pipgrid">${pips}</span>`;
}

// Timer bar needs to keep ticking down smoothly between server broadcasts
// (which only arrive on state changes, not every second) — a lightweight
// local interval re-renders just the fill width from the same roundEndsAt
// timestamp the server already sent.
setInterval(() => {
  if (latestState && latestState.phase === 'playing' && latestState.game && !latestState.game.gameOver && latestState.game.roundEndsAt) {
    const msLeft = Math.max(0, latestState.game.roundEndsAt - Date.now());
    const fill = document.getElementById('timerFill');
    if (fill) fill.style.width = Math.round((msLeft/30000)*100) + '%';
  }
}, 500);
</script>
</body>
</html>
